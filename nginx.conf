# dashboard 的站点配置（覆盖镜像自带的 /etc/nginx/conf.d/default.conf）
#
# 两个职责：
#   ① 把 dist/ 里的静态文件发给浏览器
#   ② 把 /api/ 的请求转发给后端的 api 容器
#
# 浏览器视角下所有请求都发往同一个地址（localhost:8080），
# 所以完全不存在跨域 —— 这与 vite dev 里 server.proxy 的作用是一致的，
# 只是开发期由 vite 代理、生产期由 nginx 代理。

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 后端允许 50MB 的 sourcemap 上传（MAX_SOURCEMAP_BYTES）。
    # nginx 默认上限只有 1MB，不放开会在上传时返回 413。
    client_max_body_size 51m;

    # SPA 路由回退。
    # react-router 是前端路由：/issues/abc 在服务器上没有对应文件。
    # 直接访问或刷新时，只有把 index.html 交给浏览器，
    # React 才能读到地址栏并渲染对应页面；否则就是 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理。
    # ⚠️ proxy_pass 结尾【不能】加斜杠：
    #      http://api:3000   → /api/v1/issues 原样到达后端 ✓
    #      http://api:3000/  → 被改写成 /v1/issues，全部 404 ✗
    # 这与 vite.config.ts 里「不写 rewrite，原样转发」的约定一致。
    location /api/ {
        proxy_pass http://api:3000;
        # 不设这两个头，后端日志里看到的来源全是 nginx 容器的内网 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # vite.config.ts 里 build.sourcemap = 'hidden'，dist 里会有 .map 文件。
    # 它们是给「上传到 Argus 自己」做符号化用的，不该对公网可读 —— 禁掉。
    location ~ \.map$ {
        deny all;
    }
}
